<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="MediGuide AI agent logo">
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset=".2" stop-color="#FF9F1C"/>
      <stop offset=".4" stop-color="#FFE14D"/>
      <stop offset=".6" stop-color="#2EE59D"/>
      <stop offset=".8" stop-color="#2EC5FF"/>
      <stop offset="1" stop-color="#A66CFF"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2560"/>
      <stop offset="1" stop-color="#15123A"/>
    </linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#2EC5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tile -->
  <rect x="3" y="3" width="106" height="106" rx="30" fill="#0E0B26"/>
  <rect x="3" y="3" width="106" height="106" rx="30" fill="none" stroke="url(#rb)" stroke-width="4"/>
  <!-- antenna -->
  <line x1="56" y1="20" x2="56" y2="31" stroke="url(#rb)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="56" cy="17" r="6" fill="#FF4D6D"/>
  <circle cx="56" cy="17" r="2.6" fill="#FFE14D"/>
  <!-- ears -->
  <rect x="17" y="48" width="9" height="20" rx="4.5" fill="url(#rb)"/>
  <rect x="86" y="48" width="9" height="20" rx="4.5" fill="url(#rb)"/>
  <!-- head -->
  <rect x="25" y="31" width="62" height="52" rx="18" fill="url(#face)" stroke="url(#rb)" stroke-width="3"/>
  <!-- visor -->
  <rect x="32" y="42" width="48" height="20" rx="10" fill="#0A0820"/>
  <circle cx="45" cy="52" r="8" fill="url(#eye)"/>
  <circle cx="67" cy="52" r="8" fill="url(#eye)"/>
  <circle cx="45" cy="52" r="3" fill="#FFFFFF"/>
  <circle cx="67" cy="52" r="3" fill="#FFFFFF"/>
  <!-- heartbeat mouth -->
  <polyline points="37,72 46,72 50,66 55,77 60,69 63,72 75,72" fill="none" stroke="#2EE59D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- medical cross badge -->
  <circle cx="84" cy="84" r="16" fill="#FF4D6D" stroke="#0E0B26" stroke-width="4"/>
  <rect x="81" y="75" width="6" height="18" rx="2" fill="#FFFFFF"/>
  <rect x="75" y="81" width="18" height="6" rx="2" fill="#FFFFFF"/>
</svg>
